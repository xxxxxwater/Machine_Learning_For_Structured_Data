name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install package and test requirements
        run: python -m pip install -e '.[dev]'
      - name: Run tests
        run: python -m pytest -q
      - name: Exercise mixed-data example
        run: python examples/train_mixed.py
      - name: Check distributable build
        run: |
          python -m pip install build
          python -m build --sdist --wheel

  optional-backends:
    name: Optional backends / lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install optional scientific libraries
        run: python -m pip install -e '.[dev,spline,lowess]'
      - name: Exercise real B-spline and LOWESS implementations
        run: python -m pytest -q tests/test_advanced.py
      - name: Ruff correctness lint
        run: python -m ruff check MLSD tests examples
