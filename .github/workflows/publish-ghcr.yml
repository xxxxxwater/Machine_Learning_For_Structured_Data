name: Publish MLSD to GitHub Packages

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/publish-ghcr.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-packages-mlsd-v0.2.0
  cancel-in-progress: false

jobs:
  publish:
    name: Verify and publish container
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout packaging workflow
        uses: actions/checkout@v4

      - name: Checkout immutable v0.2.0 release source
        uses: actions/checkout@v4
        with:
          ref: v0.2.0
          path: release-source

      - name: Exclude original notebooks and datasets from image
        run: cp .dockerignore release-source/.dockerignore

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate release tag and run Python regression tests
        working-directory: release-source
        run: |
          python -m pip install -e '.[dev]'
          python -c "import MLSD; assert MLSD.__version__ == '0.2.0'"
          python -m pytest -q
          python examples/train_mixed.py

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build container locally for smoke testing
        uses: docker/build-push-action@v6
        with:
          context: ./release-source
          file: ./Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          tags: ghcr.io/xxxxxwater/mlsd-structured-data:v0.2.0
          provenance: false

      - name: Run packaged MLSD smoke test
        run: docker run --rm ghcr.io/xxxxxwater/mlsd-structured-data:v0.2.0

      - name: Authenticate to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push versioned and latest package tags
        env:
          IMAGE: ghcr.io/xxxxxwater/mlsd-structured-data
        run: |
          set -euo pipefail
          docker tag "$IMAGE:v0.2.0" "$IMAGE:latest"
          docker push "$IMAGE:v0.2.0"
          docker push "$IMAGE:latest"
          docker manifest inspect "$IMAGE:v0.2.0" >/dev/null
          docker manifest inspect "$IMAGE:latest" >/dev/null
          echo "## MLSD GitHub Packages" >> "$GITHUB_STEP_SUMMARY"
          echo "Image: \`$IMAGE:v0.2.0\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Latest: \`$IMAGE:latest\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Built from the existing \`v0.2.0\` Release tag." >> "$GITHUB_STEP_SUMMARY"
          echo "See the repository Packages tab; GHCR packages may initially be private." >> "$GITHUB_STEP_SUMMARY"
