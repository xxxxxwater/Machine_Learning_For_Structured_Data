name: Publish MLSD v0.2.1 Release and GHCR

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/publish-v0.2.1.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mlsd-release-and-ghcr-v0.2.1
  cancel-in-progress: false

jobs:
  verify:
    name: Test Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install MLSD and test tools
        run: python -m pip install -e '.[dev]'
      - name: Verify release version
        run: python -c "import MLSD; assert MLSD.__version__ == '0.2.1'"
      - name: Run regression tests
        run: python -m pytest -q
      - name: Smoke-test mixed data
        run: python examples/train_mixed.py

  optional-backends:
    name: Test optional backends and Ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install development and optional dependencies
        run: python -m pip install -e '.[dev,spline,lowess]'
      - name: Test real B-spline and LOWESS implementations
        run: python -m pytest -q tests/test_advanced.py
      - name: Lint source, examples and tests
        run: python -m ruff check MLSD tests examples

  release:
    name: Build and publish v0.2.1 Release
    needs: [verify, optional-backends]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build verified wheel and source distribution
        run: |
          python -m pip install build twine
          python -m build --sdist --wheel
          python -m twine check dist/*
          test -f dist/mlsd_structured_data-0.2.1-py3-none-any.whl
          test -f dist/mlsd_structured_data-0.2.1.tar.gz
      - name: Create immutable GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view v0.2.1 >/dev/null 2>&1; then
            echo "v0.2.1 Release already exists; refusing to overwrite published assets"
          else
            if git ls-remote --exit-code --tags origin refs/tags/v0.2.1 >/dev/null 2>&1; then
              echo "::error::v0.2.1 tag exists without a release; refusing to move it"
              exit 1
            fi
            gh release create v0.2.1 dist/* \
              --title "MLSD v0.2.1 — Leakage-Safe CV & sklearn Integration" \
              --notes-file docs/releases/v0.2.1.md \
              --target "$GITHUB_SHA" \
              --latest
          fi
          gh release view v0.2.1 --json url,tagName,isDraft,isPrerelease,assets \
            --jq '"Release: " + .url + " | tag: " + .tagName + " | assets: " + ([.assets[].name] | join(", "))' \
            | tee -a "$GITHUB_STEP_SUMMARY"

  ghcr:
    name: Build and publish GHCR v0.2.1
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout immutable v0.2.1 source tag
        uses: actions/checkout@v4
        with:
          ref: v0.2.1
          path: release-source
      - name: Confirm version and source identity
        working-directory: release-source
        run: |
          set -euo pipefail
          python -c "import pathlib; p=pathlib.Path('pyproject.toml').read_text(); assert 'version = \"0.2.1\"' in p"
          grep -q 'org.opencontainers.image.version="0.2.1"' Dockerfile
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build pinned release image
        uses: docker/build-push-action@v6
        with:
          context: ./release-source
          file: ./release-source/Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          tags: ghcr.io/xxxxxwater/mlsd-structured-data:v0.2.1
          provenance: false
      - name: Smoke test packaged code and runtime version
        run: |
          set -euo pipefail
          docker run --rm ghcr.io/xxxxxwater/mlsd-structured-data:v0.2.1
          docker run --rm ghcr.io/xxxxxwater/mlsd-structured-data:v0.2.1 \
            python -c "import MLSD; assert MLSD.__version__ == '0.2.1'"
      - name: Authenticate to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish new v0.2.1 and latest tags
        env:
          IMAGE: ghcr.io/xxxxxwater/mlsd-structured-data
        run: |
          set -euo pipefail
          docker push "$IMAGE:v0.2.1"
          docker tag "$IMAGE:v0.2.1" "$IMAGE:latest"
          docker push "$IMAGE:latest"
          docker manifest inspect "$IMAGE:v0.2.1" >/dev/null
          docker manifest inspect "$IMAGE:latest" >/dev/null
          echo "## GHCR container" >> "$GITHUB_STEP_SUMMARY"
          echo "Published \`$IMAGE:v0.2.1\` and updated \`$IMAGE:latest\`." >> "$GITHUB_STEP_SUMMARY"
          echo "Existing \`$IMAGE:v0.2.0\` remains untouched." >> "$GITHUB_STEP_SUMMARY"
          echo "Source: immutable \`v0.2.1\` Git tag." >> "$GITHUB_STEP_SUMMARY"
