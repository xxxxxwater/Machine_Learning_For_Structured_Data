[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mlsd-structured-data"
version = "0.2.1.dev0"
description = "Machine learning feature extraction from heterogeneous structured data"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [{name = "Haoran Xue"}]
keywords = ["machine-learning", "structured-data", "time-series", "feature-extraction"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "numpy>=1.26,<3",
  "pandas>=2.0,<3",
  "scipy>=1.11,<2",
  "scikit-learn>=1.3,<2",
]

[project.optional-dependencies]
tsfresh = ["tsfresh>=0.20"]
spline = ["patsy>=0.5"]
lowess = ["statsmodels>=0.14"]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.8"]
all = ["tsfresh>=0.20", "patsy>=0.5", "statsmodels>=0.14"]

[tool.setuptools.packages.find]
include = ["MLSD*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py310"
line-length = 100
exclude = ["Example.ipynb", "MLSD/Transformers/pyFDA"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
